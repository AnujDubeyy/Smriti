<!doctype html><html lang="en"><meta charset="utf-8"><title>Smriti responsive QA</title><style>body{font:16px sans-serif;margin:12px}label{margin-right:16px}select,button{padding:10px}iframe{display:block;border:1px solid #666;margin-top:12px;height:800px;max-width:none}output{display:block;padding:10px}</style><label>Viewport <select id="width"><option>320</option><option>360</option><option>390</option><option>430</option><option>768</option><option>1024</option><option>1280</option><option>1440</option></select></label><label>Text scale <select id="scale"><option value="16">100%</option><option value="32">200%</option></select></label><button id="measure">Check layout</button><output id="result"></output><iframe title="Smriti preview" src="/"></iframe><script>const f=document.querySelector('iframe');function check(){f.style.width=document.querySelector('#width').value+'px';const d=f.contentDocument;if(!d)return;d.documentElement.style.fontSize=document.querySelector('#scale').value+'px';requestAnimationFrame(()=>{document.querySelector('#result').textContent=JSON.stringify({viewport:d.documentElement.clientWidth,content:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,tabs:d.querySelectorAll('nav a').length,images:Array.from(d.images).every(i=>i.complete&&i.naturalWidth>0)});});}document.querySelectorAll('select').forEach(s=>s.onchange=check);document.querySelector('#measure').onclick=check;f.onload=check;</script></html>
